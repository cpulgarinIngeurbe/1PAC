<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1PAC Ingeurbe</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Roboto,sans-serif;background:#f6f7f2;color:#1c1d18}
#root{min-height:100vh}@keyframes spin{to{transform:rotate(360deg)}}
.splash{position:fixed;inset:0;background:#f6f7f2;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
.splash.out{display:none}.splash-logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(160deg,#a2c617,#758b29);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;color:#151708}
.spinner{width:26px;height:26px;border:3px solid #e6e7df;border-top-color:#a2c617;border-radius:50%;animation:spin 0.75s linear infinite}
</style></head><body>
<div id="splash" class="splash">
<div class="splash-logo">1</div>
<h1 style="font-size:20px;font-weight:700">1PAC</h1>
<p style="color:#8e8d85;font-size:12px">Ingeurbe · Cargando...</p>
<div class="spinner"></div>
</div>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;const T={colors:{primary:'#a2c617',dark:'#758b29',bg:'#f6f7f2',surf:'#fff',text:'#1c1d18',gray:'#8e8d85',border:'#d4d6c9'},sp:{md:'16px',lg:'24px',xl:'32px'},r:{md:'10px',lg:'14px'}};
function Login({onL}){const[r,sR]=useState('RESIDENTE');return<div style={{minHeight:'100vh',display:'flex'}}>
<div style={{flex:'0 0 50%',background:`linear-gradient(160deg,${T.colors.primary},${T.colors.dark})`,color:'#151708',padding:T.sp.xl,display:'flex',flexDirection:'column'}}>
<div style={{display:'flex',alignItems:'center',gap:'12px'}}><div style={{w:'40px',h:'40px',background:'rgba(255,255,255,0.2)',borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'24px',fontWeight:'900'}}>1</div>
<div><div style={{fontWeight:700,fontSize:'20px'}}>1PAC</div><div style={{fontSize:'10px',opacity:0.7}}>INGEURBE</div></div></div>
<div style={{marginTop:'auto',maxWidth:'480px'}}><h1 style={{fontSize:'48px',fontWeight:800,lineHeight:1.1,marginBottom:'24px'}}>Control de obra</h1>
<p style={{fontSize:'16px',lineHeight:1.5,opacity:0.85}}>Sistema de reportería semanal para Ingeurbe</p></div></div>
<div style={{flex:'0 0 50%',display:'flex',alignItems:'center',justifyContent:'center',padding:T.sp.xl}}>
<div style={{width:'100%',maxWidth:'400px'}}><div style={{width:'60px',height:'60px',background:`linear-gradient(140deg,${T.colors.primary},${T.colors.dark})`,borderRadius:'14px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'32px',fontWeight:900,color:'#151708',marginBottom:T.sp.md}}>1</div>
<h2 style={{fontSize:'24px',fontWeight:700}}>1PAC</h2><p style={{color:T.colors.gray,fontSize:'14px'}}>Demo</p>
<select value={r} onChange={(e)=>sR(e.target.value)} style={{width:'100%',padding:'12px',marginTop:T.sp.lg,marginBottom:T.sp.lg,border:`1px solid ${T.colors.border}`,borderRadius:T.r.md,fontFamily:'Roboto'}}>
<option value="RESIDENTE">Residente</option><option value="VALIDADOR">Validador</option><option value="ADMIN">Admin</option></select>
<button onClick={()=>onL({role:r,email:'demo@ing.com',name:`Demo`})} style={{width:'100%',padding:'14px',background:T.colors.primary,color:'#151708',border:'none',borderRadius:T.r.md,fontWeight:600,cursor:'pointer'}}>Continuar</button></div></div></div>}</div>

function Dashboard({user,onLogout}){const[tab,setTab]=useState('reporte');return<div style={{minHeight:'100vh',background:T.colors.bg,padding:T.sp.xl}}>
<div style={{maxWidth:'1200px',margin:'0 auto'}}><div style={{background:T.colors.surf,padding:T.sp.lg,borderRadius:T.r.lg,marginBottom:T.sp.xl,display:'flex',justifyContent:'space-between',alignItems:'center',border:`1px solid ${T.colors.border}`}}>
<div><h1 style={{fontSize:'28px',fontWeight:800,margin:0}}>1PAC</h1><p style={{fontSize:'12px',color:T.colors.gray,margin:'4px 0 0 0'}}>Semana 30</p></div>
<div style={{display:'flex',gap:T.sp.md}}><div style={{textAlign:'right'}}><p style={{margin:0,fontSize:'13px'}}>{user.email}</p><p style={{margin:'2px 0 0 0',fontSize:'12px',fontWeight:600}}>Rol: {user.role}</p></div>
<button onClick={onLogout} style={{padding:'8px 16px',background:'#ff6b6b',color:'white',border:'none',borderRadius:T.r.md,cursor:'pointer'}}>Salir</button></div></div>

<div style={{display:'flex',gap:T.sp.md,borderBottom:`1px solid ${T.colors.border}`,marginBottom:T.sp.xl}}>
{['reporte','programar','historial'].map(t=><button key={t} onClick={()=>setTab(t)} style={{padding:`${T.sp.md} ${T.sp.lg}`,background:'none',border:'none',borderBottom:tab===t?`2px solid ${T.colors.primary}`:'none',color:tab===t?T.colors.primary:T.colors.gray,cursor:'pointer',fontSize:'14px',fontWeight:600,fontFamily:'Roboto'}}>
{t==='reporte'&&'Reportar'}{t==='programar'&&'Programar'}{t==='historial'&&'Historial'}</button>)}</div>

<div style={{background:T.colors.surf,padding:T.sp.lg,borderRadius:T.r.lg,border:`1px solid ${T.colors.border}`,minHeight:'300px'}}>
{tab==='reporte'&&<div><h2 style={{fontSize:'18px',fontWeight:700,marginBottom:T.sp.lg}}>Tareas</h2><p style={{color:T.colors.gray,textAlign:'center'}}>Sin tareas esta semana</p></div>}
{tab==='programar'&&<div><h2 style={{fontSize:'18px',fontWeight:700,marginBottom:T.sp.lg}}>Programar</h2><button style={{padding:'10px 20px',background:T.colors.primary,color:'#151708',border:'none',borderRadius:T.r.md,cursor:'pointer',fontWeight:600}}>Cargar Proyectos</button></div>}
{tab==='historial'&&<div><h2 style={{fontSize:'18px',fontWeight:700}}>Historial</h2><p style={{color:T.colors.gray}}>Sin historial</p></div>}</div></div></div>}

function App(){const[user,setUser]=useState(null);useEffect(()=>{setTimeout(()=>{document.getElementById('splash').classList.add('out')},800);},[]);return user?<Dashboard user={user} onLogout={()=>setUser(null)}/>:<Login onL={(u)=>setUser(u)}/>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
